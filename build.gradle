plugins {
    // obfuscated versions (up to 1.21.11) are remapped from Mojang's mappings; 26.x is not obfuscated
    id 'fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

// one source tree for every supported Minecraft version: ./gradlew build -Pminecraft_version=1.21.1
apply from: 'preprocess.gradle'
def mc = project.minecraft_version
def at = { String v -> ppCompareVersions(mc, v) >= 0 }
def obfuscated = !at('26')
apply plugin: obfuscated ? 'fabric-loom' : 'net.fabricmc.fabric-loom'

def versionFile = file("versions/${mc}.properties")
if (!versionFile.exists()) throw new GradleException("Minecraft ${mc} is not supported (no ${versionFile.name})")
def deps = new Properties()
versionFile.withInputStream { deps.load(it) }
def javaRelease = deps.java_version as int

version = "${project.mod_version}+${mc}"
group = project.maven_group
base { archivesName = 'dreamdisplays-lumen' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

// dev only: a test scene and a driver that takes screenshots (see scripts/autotest.sh)
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

ext.ppMinecraft = mc
ext.ppLoader = 'fabric'
preprocessSources(['src/main/java'], ['**/*.java'])
preprocessSources(['src/testmod/java'], ['**/*.java'], [], 'testmod')

// the shaders of the game's rendering era (their language and uniforms change with it)
def shaderEra = at('26.3') ? 'renderpearl' : at('1.21.5') ? 'pipeline' : 'legacy'
sourceSets.main.resources.srcDir "src/shaders/${shaderEra}"

// LambDynamicLights ships its API nested inside the mod jar (before 26.x one level deeper, in the Fabric jar of a
// multi-loader jar). It is taken out while configuring: Loom remaps mod dependencies of obfuscated versions then,
// before any task could run. LambDynamicLights 2.x (before 1.20) has no such API: then there is none.
// (Fetched straight from Modrinth: resolving a configuration this early upsets Loom.)
def ldlApiJar = {
    def out = layout.buildDirectory.dir("ldl-api/${mc}").get().asFile
    def existing = out.listFiles()?.find { it.name.endsWith('.jar') }
    if (existing != null) return existing
    if (new File(out, 'none').exists()) return null
    def find
    find = { byte[] jar, int depth ->
        def nested = []
        File found = null
        new java.util.zip.ZipInputStream(new ByteArrayInputStream(jar)).withCloseable { zip ->
            for (def e = zip.nextEntry; e != null; e = zip.nextEntry) {
                def name = e.name
                if (!name.startsWith('META-INF/jars/') || !name.endsWith('.jar')) continue
                def bytes = zip.readAllBytes()
                def file = name.substring(name.lastIndexOf('/') + 1)
                if (file.startsWith('lambdynamiclights-api-')) {
                    out.mkdirs()
                    found = new File(out, file)
                    found.bytes = bytes
                } else if (file.startsWith('lambdynamiclights-') && !file.contains('neoforge')) {
                    nested << bytes
                }
            }
        }
        if (found != null || depth >= 2) return found
        for (def n : nested) {
            def f = find(n, depth + 1)
            if (f != null) return f
        }
        return null
    }
    def version = new groovy.json.JsonSlurper().parse(new URL("https://api.modrinth.com/v2/version/${deps.lambdynamiclights_version}"))
    def file = version.files.find { it.primary } ?: version.files[0]
    def api = find(new URL(file.url).bytes, 0)
    if (api == null) {
        out.mkdirs()
        new File(out, 'none').text = 'no API in this version'
    }
    return api
}()

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    if (obfuscated) {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${deps.fabric_api_version}"
        modImplementation "maven.modrinth:dreamdisplays:${deps.dreamdisplays_version}"
        modCompileOnly "maven.modrinth:iris:${deps.iris_version}"
        // not in the dev client: before 26.x it is a multi-loader jar that only resolves when installed normally
        if (project.shaders.toBoolean()) {
            modLocalRuntime "maven.modrinth:iris:${deps.iris_version}"
            modLocalRuntime "maven.modrinth:sodium:${deps.sodium_version}"
        }
    } else {
        implementation "net.fabricmc:fabric-loader:${loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${deps.fabric_api_version}"
        implementation "maven.modrinth:dreamdisplays:${deps.dreamdisplays_version}"
        compileOnly "maven.modrinth:iris:${deps.iris_version}"
        localRuntime "maven.modrinth:lambdynamiclights:${deps.lambdynamiclights_version}"
        if (project.shaders.toBoolean()) {
            localRuntime "maven.modrinth:iris:${deps.iris_version}"
            localRuntime "maven.modrinth:sodium:${deps.sodium_version}"
        }
    }
    // obfuscated versions: the API jar uses intermediary names and has to be remapped like a mod
    if (ldlApiJar != null) {
        if (obfuscated) modCompileOnly files(ldlApiJar) else compileOnly files(ldlApiJar)
    }
}

// versions where the game hides what the mod needs and Fabric API does not open it
def accessWidener = file("src/main/accesswideners/${mc}.accesswidener")

loom {
    if (accessWidener.exists()) accessWidenerPath = accessWidener
    mods {
        ddlumen { sourceSet sourceSets.main }
        ddlumen_test { sourceSet sourceSets.testmod }
    }
    runs {
        autotest {
            client()
            name = 'Lumen auto test'
            source sourceSets.testmod
            runDir = "run/autotest/${mc}"
            programArgs '--quickPlaySingleplayer', 'lumen-test', '--width', '960', '--height', '540'
            // the test video is served from 127.0.0.1, which Dream Displays refuses by default
            vmArgs '-Xmx3G', '-Ddreamdisplays.allowPrivateUrls=true'
            ['testPrefix': 'prefix', 'testMode': 'mode', 'testVideo': 'video', 'testSeek': 'seek'].each { prop, key ->
                if (project.hasProperty(prop)) vmArg "-Dddlumen.test.${key}=${project.property(prop)}"
            }
        }
    }
}

processResources {
    def props = [version: project.version, minecraft: "~${mc}", java: javaRelease, mixinJava: Math.min(javaRelease, 21),
                 accessWidener: accessWidener.exists() ? '"accessWidener": "ddlumen.accesswidener",' : '']
    if (accessWidener.exists()) from(accessWidener) { rename { 'ddlumen.accesswidener' } }
    inputs.properties props
    filesMatching(['fabric.mod.json', 'ddlumen.mixins.json']) { expand props }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaRelease
    it.options.encoding = 'UTF-8'
}

// obfuscated versions: the remapped jar is the release
if (obfuscated) {
    remapJar { archiveFileName = "dreamdisplays-lumen-${project.mod_version}+${mc}.jar" }
} else {
    jar { archiveFileName = "dreamdisplays-lumen-${project.mod_version}+${mc}.jar" }
}
