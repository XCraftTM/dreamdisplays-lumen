plugins {
    // 26.x is not obfuscated: no remapping
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = 'dreamdisplays-lumen' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

// LambDynamicLights only ships its API nested inside the mod jar
configurations { lambdynamiclights { transitive = false } }

def ldlApiDir = layout.buildDirectory.dir('ldl-api')
def extractLdlApi = tasks.register('extractLdlApi', Copy) {
    from({ zipTree(configurations.lambdynamiclights.singleFile) }) {
        include 'META-INF/jars/lambdynamiclights-api-*.jar'
        eachFile { it.path = it.name }
    }
    into ldlApiDir
    includeEmptyDirs = false
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    implementation "maven.modrinth:dreamdisplays:${dreamdisplays_version}"

    lambdynamiclights "maven.modrinth:lambdynamiclights:${lambdynamiclights_version}"
    compileOnly files(ldlApiDir.map { it.asFileTree.matching { include '*.jar' } }) { builtBy extractLdlApi }
    localRuntime "maven.modrinth:lambdynamiclights:${lambdynamiclights_version}"

    compileOnly "maven.modrinth:iris:${iris_version}"
    if (project.shaders.toBoolean()) {
        localRuntime "maven.modrinth:iris:${iris_version}"
        localRuntime "maven.modrinth:sodium:${sodium_version}"
    }
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

jar {
    from('LICENSE') { rename { "${it}_${base.archivesName.get()}" } }
}
