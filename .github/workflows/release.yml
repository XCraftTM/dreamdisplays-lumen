# Builds the mod for every Minecraft version and publishes a GitHub release for the version in gradle.properties
# (mod_version) when it has none yet. So a release is made by raising mod_version, adding
# .github/release-notes/v<version>.md and pushing main (or by pushing the tag v<version>). Pushes without a new
# version only check and stop.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the version to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = tag ] && [ "${{ github.ref_name }}" != "$tag" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match mod_version $version"
            exit 1
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag exists already"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          # the notes come from the commit that started this run; an existing tag decides what is built
          notes=".github/release-notes/$tag.md"
          if [ -f "$notes" ]; then cp "$notes" "$RUNNER_TEMP/notes.md"; fi
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "Building the existing tag $tag"
            git checkout -q "refs/tags/$tag"
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.skip == 'false'

      - name: Build every Minecraft version
        if: steps.version.outputs.skip == 'false'
        run: bash scripts/build-all.sh

      - name: Publish the release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes=(--generate-notes)
          if [ -f "$RUNNER_TEMP/notes.md" ]; then notes=(--notes-file "$RUNNER_TEMP/notes.md"); fi
          gh release create "$TAG" dist/*.jar --title "Dream Displays Lumen $VERSION" --target "$GITHUB_SHA" "${notes[@]}"
